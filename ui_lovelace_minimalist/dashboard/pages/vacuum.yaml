title: "Vacuum"
path: "vacuum"
icon: "mdi:robot-vacuum"
type: sections
max_columns: 4
cards: [ ]
badges: [ ]
sections:

  - type: grid
    column_span: 1
    cards:
      - type: heading
        heading_style: title
        heading: Roborock S7
        icon: mdi:robot-vacuum
      - type: custom:xiaomi-vacuum-map-card
        entity: vacuum.roborock_s7
        map_locked: true
        vacuum_platform: Roborock
        tiles: [ ]
        icons: [ ]
        map_source:
          camera: image.roborock_s7_map_0_custom
          crop:
            top: 100
            left: 170
            right: 10
            bottom: 110
        calibration_source:
          camera: true
        map_modes:
          - template: vacuum_clean_zone_predefined
            predefined_selections:
              # bathroom
              - zones: [[24786, 20301, 26747, 22023]]
              # hallway
              - zones: [[24752, 22029, 27058, 26033]]
              # kitchen
              - zones: [[20948, 23516, 24777, 28004]]
              # office
              - zones: [[20879, 19298, 24847, 23336]]
              # living room
              - zones: [[27033, 19298, 32764, 23301]]
#          - template: vacuum_goto
#          - template: vacuum_clean_zone
      - type: custom:mushroom-vacuum-card
        entity: vacuum.roborock_s7
        icon_animation: true
        fill_container: true
        commands:
          - start_pause
          - locate
          - clean_spot
          - return_home
        layout_options:
          grid_columns: full


